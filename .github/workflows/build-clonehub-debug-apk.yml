name: Build CloneHub Debug APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "cve/**"
      - "third_party/**"
      - "virtualapp-engine/**"
      - ".gitmodules"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-clonehub-debug-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clonehub-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-emulator-smoke-test:
    name: Build, launch, and capture Android startup logs
    runs-on: ubuntu-latest
    steps:
      - name: Check out CloneHub and required submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install VirtualApp native build NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;21.4.7075529"
          test -d "$ANDROID_HOME/ndk/21.4.7075529"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run CloneHub lifecycle unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Preserve APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare emulator diagnostics folder
        if: always()
        run: mkdir -p emulator-diagnostics

      - name: Install and launch CloneHub on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-smoke-test.sh

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-emulator-diagnostics
          path: emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
