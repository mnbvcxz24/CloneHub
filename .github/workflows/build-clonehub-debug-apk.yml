name: Build CloneHub Debug APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "cve/**"
      - "third_party/**"
      - ".gitmodules"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-clonehub-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clonehub-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload CloneHub debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out CloneHub and required submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;29.0.13846066"
          test -d "$ANDROID_HOME/ndk/29.0.13846066"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile NewBlackbox engine modules (not linked to host APK)
        run: gradle --no-daemon :Bcore:assembleDebug

      - name: Run CloneHub lifecycle unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build CloneHub debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
