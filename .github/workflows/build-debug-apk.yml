name: Build CloneHub Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main with VirtualApp source
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;30.0.0" "ndk;21.4.7075529"

      - name: Build CloneHub debug APK
        working-directory: third_party/VirtualApp
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload CloneHub debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-debug-apk
          path: third_party/VirtualApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
