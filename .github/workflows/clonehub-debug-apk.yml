name: Build CloneHub Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CloneHub debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CloneHub with VirtualApp source
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          # sdkmanager may close the input after accepting all licenses;
          # disable pipefail only for this yes pipeline to avoid a SIGPIPE
          # from yes being mistaken for a license-acceptance failure.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;30.0.0" \
            "ndk;21.4.7075529"

      - name: Build CloneHub debug APK
        working-directory: third_party/VirtualApp
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug :shell:assembleDebug

      - name: Upload CloneHub debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-debug-apk
          path: |
              third_party/VirtualApp/app/build/outputs/apk/debug/*.apk
              third_party/VirtualApp/shell/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
